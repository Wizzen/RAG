<section id="vt-ai-panel" class="vt-ai-panel" role="region" aria-label="EnGenie 设备助手" aria-busy="false" hidden>
  <header class="vt-ai-head"><span class="vt-ai-avatar">{% include 'kb/_assistant_avatar.html' %}</span><div><h2>EnGenie</h2><small>设备分析 · 当前车辆与所选部件</small></div><button id="vt-ai-clear" type="button">清空对话</button><button id="vt-ai-close" type="button" aria-label="收起 EnGenie 设备助手">×</button></header>
  <div class="vt-ai-context"><div id="vt-ai-context"></div><div class="vt-ai-options"><select id="vt-ai-scope" aria-label="AI分析范围"><option value="selected">所选部件及下级</option><option value="train">全车</option></select><label><input type="checkbox" id="vt-ai-qaqc">结合 QAQC 记录</label></div></div>
  <div id="vt-ai-suggestions" class="vt-ai-suggestions"><button type="button" data-ai-prompt="explain">解释部件</button><button type="button" data-ai-prompt="audit">核对记录</button><button type="button" data-ai-prompt="qaqc">分析 QAQC / MRB</button><button type="button" data-ai-prompt="help">操作指引</button></div>
  <div id="vt-ai-messages" class="vt-ai-messages" role="log" aria-label="EnGenie 设备对话" aria-live="polite"></div>
  <p id="vt-ai-status" class="vt-ai-status" role="status">选择部件后提问，或使用上方快捷分析。</p>
  <form id="vt-ai-form" class="vt-ai-form"><label for="vt-ai-question" class="vt-subtle">车辆问题</label><textarea id="vt-ai-question" maxlength="1600" rows="3" placeholder="例如：这个销轴对应哪张工单？有哪些位置需要补充追踪记录？"></textarea><div><small>Enter 发送 · Shift + Enter 换行</small><button id="vt-ai-send" type="submit" class="vt-primary">发送</button></div></form>
  <p class="vt-ai-foot">提问时发送本次部件、项目摘要与记录样本；附件原文和参考图不发送。分析供资料核对，检验结论以原始记录与专业复核为准。</p>
</section>
