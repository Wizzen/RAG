<dialog id="vt-source-dialog" class="vt-source-dialog" aria-labelledby="vt-source-name">
  <header class="vt-source-header"><div><span>文档原文 · <b id="vt-source-drawing"></b></span><h2 id="vt-source-name">原文定位</h2></div><button id="vt-source-close" type="button" aria-label="关闭原文定位">×</button></header>
  <div class="vt-source-layout"><aside id="vt-source-list" class="vt-source-list" aria-label="匹配文档与页码"></aside><section class="vt-source-reader">
    <div class="vt-source-toolbar"><button id="vt-source-prev" type="button">上一页</button><form id="vt-source-go"><label for="vt-source-page">第</label><input id="vt-source-page" type="number" min="1" value="1" aria-label="PDF页码"><span id="vt-source-pages"></span><button type="submit">跳转</button></form><button id="vt-source-next" type="button">下一页</button><span class="vt-source-toolbar-spacer"></span><button id="vt-source-refresh" type="button">刷新出处</button><button id="vt-source-zoom" type="button">放大</button></div>
    <p id="vt-source-status" class="vt-source-status" role="status"></p><div id="vt-source-scroll" class="vt-source-scroll"><div id="vt-source-paper" class="vt-source-paper"><img id="vt-source-image" alt="原PDF页面"><div id="vt-source-boxes"></div></div></div><p id="vt-source-quote" class="vt-source-quote"></p>
  </section></div>
</dialog>
