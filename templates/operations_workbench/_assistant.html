<button id="ops-ai-launcher" class="ops-ai-launcher" type="button" aria-label="打开运维 AI"
        aria-haspopup="dialog" aria-controls="ops-ai-drawer" aria-expanded="false">
  {% include 'kb/_assistant_avatar.html' %}
  <span>运维 AI</span>
</button>

<dialog id="ops-ai-drawer" class="ops-assistant is-wide" aria-labelledby="ops-ai-title">
  <header class="ops-assistant-head">
    <span class="ops-assistant-avatar">{% include 'kb/_assistant_avatar.html' %}</span>
    <div><small lang="en">OPERATIONS AI</small><h2 id="ops-ai-title">运维 AI</h2></div>
    <div class="ops-assistant-tools">
      <button id="ops-ai-new" class="ops-assistant-tool" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新对话</span>
      </button>
      <button id="ops-ai-history-toggle" class="ops-assistant-tool" type="button" aria-controls="ops-ai-history" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.1 8a8.8 8.8 0 1 1-.8 5.9M3.3 4.5V9h4.5M12 7.5v5l3.5 2"/></svg><span>历史</span>
      </button>
      <button id="ops-ai-size" class="ops-assistant-tool" type="button" aria-pressed="true" aria-label="切换为侧边栏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg><span>侧边栏</span>
      </button>
      <button id="ops-ai-close" class="ops-assistant-close" type="button" aria-label="收起运维 AI" autofocus>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </header>
  <div class="ops-assistant-layout">
    <aside id="ops-ai-history" class="ops-ai-history" aria-label="运维 AI 历史对话">
      <div class="ops-ai-history-head">
        <h3>历史对话</h3>
        <button id="ops-ai-clear" class="ops-link" type="button">清空</button>
      </div>
      <p class="ops-ai-history-note">仅保存在本浏览器，按当前账号区分。</p>
      <ol id="ops-ai-sessions" class="ops-ai-sessions"></ol>
    </aside>

    <section class="ops-ai-chat" aria-label="当前对话">
      <div id="ops-ai-thread" class="ops-ai-thread" aria-live="polite">
        <div id="ops-ai-welcome" class="ops-ai-welcome">
          <p class="ops-assistant-intro">查询工单、设备日志和停机事件。回答中的工单号可直接点击查看详情，每次回答下方可查看查询依据。</p>
          <div class="ops-assistant-examples" role="group" aria-label="问题示例">
            <button type="button" data-example="查询最近 7 天的停机事件，按停机时长汇总。">停机概览</button>
            <button type="button" data-example="查询最近 7 天描述包含轴承的 Maximo 工单。">工单排查</button>
            <button type="button" data-example="查询过去 1 小时的 Splunk Apex 消息，并列出时间和设备。">近期日志</button>
          </div>
        </div>
      </div>
      <form id="ops-ai-form" class="ops-ai-composer">
        <textarea id="ops-question" required maxlength="1200" rows="2" aria-label="你的问题"
                  placeholder="输入问题，Enter 发送，Shift+Enter 换行。可以追问上一条回答。"></textarea>
        <div class="ops-assistant-actions">
          <label class="ops-ai-source">查询来源
            <select id="ops-ai-source">
              <option value="auto">自动选择</option><option value="maximo">Maximo</option>
              <option value="splunk">Splunk</option><option value="downtime">Downtime</option>
            </select>
          </label>
          <button id="ops-ai-cancel" class="ops-link" type="button" hidden>取消分析</button>
          <button id="ops-ask" type="submit">发送<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg></button>
        </div>
      </form>
    </section>

    <section id="ops-ai-pane" class="ops-ai-pane" aria-labelledby="ops-ai-pane-title" hidden>
      <header>
        <div><div class="ops-kicker" id="ops-ai-pane-source">记录详情</div><h3 id="ops-ai-pane-title">详情</h3></div>
        <button id="ops-ai-pane-close" class="ops-assistant-close" type="button" aria-label="关闭详情">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="ops-ai-pane-body" class="ops-detail-body"></div>
    </section>
  </div>
</dialog>
