{% comment %}
循环剧场 · 米奇头文字环 —— 项目 logo（首页 / 登录 / 注册 / 登出共用同一引擎）。
用法：{% include "_loop_mark.html" %}（默认），或 with mark_class="xxx" 附加尺寸类；
外层 .loop-mark 只负责居中，尺寸由各页 CSS 指定（如 .home-mark svg / .auth-mark svg）。
{% endcomment %}
<style>
  /* ── 循环剧场（与 mickey-options 第 16 卡 v3.1 同引擎） ── */
  .loop-mark{display:flex;justify-content:center}
  .loop-mark svg{width:100%;height:auto}
  .tring{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;font-weight:600;
    letter-spacing:.42em;fill:var(--brand);fill-opacity:.85}
  .tring-base{fill:none;stroke:var(--brand);stroke-opacity:.1;stroke-width:1}
  .ink-halo{fill:none;stroke:var(--brand);stroke-width:13;stroke-opacity:.13;filter:url(#soft16)}
  .runner{fill:var(--brand);filter:url(#penGlow)}
  .dust{fill:var(--brand);transform-box:fill-box;transform-origin:center;
    animation:twinkle 2.6s ease-in-out infinite}
  .dust.d2{animation-delay:.5s}.dust.d3{animation-delay:1.1s}.dust.d4{animation-delay:1.6s}
  .dust.d5{animation-delay:2s}.dust.d6{animation-delay:.8s}.dust.d7{animation-delay:1.35s}
  .dust.d8{animation-delay:.25s}.dust.d9{animation-delay:1.85s}.dust.d10{animation-delay:2.3s}
  @keyframes twinkle{0%,100%{opacity:.12;transform:scale(.55) rotate(0deg)}
    50%{opacity:.95;transform:scale(1.15) rotate(18deg)}}
  .ring16 .trch{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;
    fill:var(--brand);text-anchor:middle}
  .ring16 .pdot{fill:var(--brand)}
  .ring16[data-rp="rp16a"] .trch,.ring16[data-rp="rp16b"] .trch{font-size:11px}
  #loopFinale2{transition:opacity 1s ease}
  #loopAmbient{opacity:.55;transition:opacity .8s ease}
</style>
<div class="loop-mark {{ mark_class|default:'' }}" aria-hidden="true">
  <svg viewBox="70 42 320 280" id="loopSvg">
    <defs>
      <path id="rp16a" d="M120,146 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/>
      <path id="rp16b" d="M248,146 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/>
      <path id="rp16c" d="M156,214 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0"/>
      <filter id="soft16" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="6"/></filter>
      <filter id="glow16" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <!-- 墨晕 + 极淡基圆（常驻底光：拼字目标本就存在，不做突现） -->
    <g id="loopAmbient">
      <circle class="ink-halo" cx="166" cy="146" r="46"/>
      <circle class="ink-halo" cx="294" cy="146" r="46"/>
      <circle class="ink-halo" cx="230" cy="214" r="74"/>
      <circle class="tring-base" cx="166" cy="146" r="46"/>
      <circle class="tring-base" cx="294" cy="146" r="46"/>
      <circle class="tring-base" cx="230" cy="214" r="74"/>
    </g>
    <!-- 三个旋转环：字符与粒子由 JS 注入 -->
    <g class="ring16" data-rp="rp16a" data-cx="166" data-cy="146" data-dur="26" data-dir="1"></g>
    <g class="ring16" data-rp="rp16b" data-cx="294" data-cy="146" data-dur="22" data-dir="-1"></g>
    <g class="ring16" data-rp="rp16c" data-cx="230" data-cy="214" data-dur="32" data-dir="1"></g>
    <!-- 双子 + 星尘（steady 活动层） -->
    <g class="finale" id="loopFinale2">
      <circle class="runner" r="3.5" filter="url(#glow16)">
        <animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M120,146 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></circle>
      <circle class="runner" r="2.5">
        <animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M120,146 a46,46 0 1,0 92,0 a46,46 0 1,0 -92,0"/></circle>
      <circle class="runner" r="3.5" filter="url(#glow16)">
        <animateMotion dur="7s" begin="-1s" repeatCount="indefinite" path="M248,146 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></circle>
      <circle class="runner" r="2.5">
        <animateMotion dur="10s" begin="-5s" repeatCount="indefinite" path="M248,146 a46,46 0 1,0 92,0 a46,46 0 1,0 -92,0"/></circle>
      <circle class="runner" r="4" filter="url(#glow16)">
        <animateMotion dur="11s" begin="-2s" repeatCount="indefinite" path="M156,214 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0"/></circle>
      <circle class="runner" r="2.5">
        <animateMotion dur="15s" begin="-8s" repeatCount="indefinite" path="M156,214 a74,74 0 1,0 148,0 a74,74 0 1,0 -148,0"/></circle>
      <g class="dusts">
        <path class="dust"    d="M118,104 l2.2,5.6 5.6,2.2 -5.6,2.2 -2.2,5.6 -2.2,-5.6 -5.6,-2.2 5.6,-2.2z"/>
        <path class="dust d2" d="M330,96 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z"/>
        <path class="dust d3" d="M150,236 l1.8,4.6 4.6,1.8 -4.6,1.8 -1.8,4.6 -1.8,-4.6 -4.6,-1.8 4.6,-1.8z"/>
        <path class="dust d4" d="M318,232 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z"/>
        <path class="dust d5" d="M230,120 l1.6,4 4,1.6 -4,1.6 -1.6,4 -1.6,-4 -4,-1.6 4,-1.6z"/>
        <path class="dust d6" d="M84,180 l1.6,4 4,1.6 -4,1.6 -1.6,4 -1.6,-4 -4,-1.6 4,-1.6z"/>
        <path class="dust d7" d="M372,178 l1.6,4 4,1.6 -4,1.6 -1.6,4 -1.6,-4 -4,-1.6 4,-1.6z"/>
        <path class="dust d8" d="M208,300 l1.8,4.6 4.6,1.8 -4.6,1.8 -1.8,4.6 -1.8,-4.6 -4.6,-1.8 4.6,-1.8z"/>
        <path class="dust d9" d="M262,300 l1.4,3.6 3.6,1.4 -3.6,1.4 -1.4,3.6 -1.4,-3.6 -3.6,-1.4 3.6,-1.4z"/>
        <path class="dust d10" d="M196,60 l1.4,3.6 3.6,1.4 -3.6,1.4 -1.4,3.6 -1.4,-3.6 -3.6,-1.4 3.6,-1.4z"/>
      </g>
    </g>
  </svg>
</div>
<script>
// ── 16 v3.1 循环剧场：JS 定时调度（webview 对 SVG 长延迟过渡不可靠，全部 setTimeout） ──
const LOOP2 = { timers: [] };
function l2Clear(){ LOOP2.timers.forEach(t => clearTimeout(t)); LOOP2.timers = []; }
function l2At(fn, ms){ LOOP2.timers.push(setTimeout(fn, ms)); }

function l2BuildRings(){
  const NS = 'http://www.w3.org/2000/svg';
  const BASE = ['DOC · SEARCH · ANSWER', 'DOC · SEARCH · ANSWER', 'SHDR RAG · DOC · SEARCH'];
  document.querySelectorAll('.ring16').forEach((ring, idx) => {
    ring.innerHTML = '';
    // SMIL 旋转（中心用本地坐标，viewBox 偏移无影响；innerHTML 重建后重挂）
    const at = document.createElementNS(NS, 'animateTransform');
    at.setAttribute('attributeName', 'transform');
    at.setAttribute('type', 'rotate');
    const dir = +ring.dataset.dir || 1;
    at.setAttribute('from', (dir < 0 ? 360 : 0) + ' ' + ring.dataset.cx + ' ' + ring.dataset.cy);
    at.setAttribute('to',   (dir < 0 ? 0 : 360) + ' ' + ring.dataset.cx + ' ' + ring.dataset.cy);
    at.setAttribute('dur', (+ring.dataset.dur || 46) + 's');
    at.setAttribute('repeatCount', 'indefinite');
    ring.appendChild(at);
    try { at.beginElement(); } catch (e) {}   // 动态插入需显式启动
    const pathId = ring.dataset.rp;
    const cx = +ring.dataset.cx, cy = +ring.dataset.cy, radius = (idx === 2) ? 74 : 46;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'tring');
    const tp = document.createElementNS(NS, 'textPath');
    tp.setAttribute('href', '#' + pathId);
    t.appendChild(tp); ring.appendChild(t);
    const unit = BASE[idx] + ' · ';
    let str = unit;
    tp.textContent = str;
    void ring.getBoundingClientRect();
    const one = t.getComputedTextLength();
    const need = 2 * Math.PI * radius * 1.18;
    while (one * (str.length / unit.length) < need) str += unit;
    tp.textContent = str;
    void ring.getBoundingClientRect();
    const chars = [];
    try {
      const n = t.getNumberOfChars();
      let lx = -1e9, ly = -1e9;
      for (let i = 0; i < n; i++){
        const p = t.getStartPositionOfChar(i);
        if (Math.abs(p.x - lx) < 1.2 && Math.abs(p.y - ly) < 1.2) break;
        // 溢出字符在部分渲染器返回 (0,0) 而非堆叠：硬校验必须落在圆周上
        if (Math.abs(Math.hypot(p.x - cx, p.y - cy) - radius) > 2) break;
        lx = p.x; ly = p.y;
        chars.push([p.x, p.y, t.getRotationOfChar(i), str[i]]);
      }
    } catch(e) {}
    t.remove();
    // 闭合环接缝：字符只放得下一圈，尾部停在词中间（如 "...· DOC"）时
    // 会与开头 "DOC" 相连成 "DOCDOC"。裁到最后一个 '·' 为止，接缝变 "· DOC"。
    while (chars.length && chars[chars.length - 1][3] !== '·') chars.pop();
    if (!chars.length) return;
    const DY = 4.4;
    chars.forEach(([x, y, rot, ch]) => {
      const ang = Math.random() * Math.PI * 2, dist = 55 + Math.random() * 110;
      const d = document.createElementNS(NS, 'circle');
      // 粒子落在字符视觉中心：路径点沿法线（指向圆心）内移 8px
      const nx = (x - cx) / radius, ny = (y - cy) / radius;   // 单位径向（向外）
      const gx = x - 8 * nx, gy = y - 8 * ny;
      d.setAttribute('cx', gx.toFixed(1)); d.setAttribute('cy', gy.toFixed(1));
      d.setAttribute('r', (2 + Math.random() * 1.3).toFixed(2));
      d.setAttribute('class', 'pdot');
      d.style.transition = 'transform .9s cubic-bezier(.25,.8,.3,1), opacity .3s ease';
      d.style.transform = 'translate(' + (Math.cos(ang)*dist).toFixed(1) + 'px,' + (Math.sin(ang)*dist).toFixed(1) + 'px)';
      d.dataset.home = 'translate(' + (Math.cos(ang)*dist).toFixed(1) + 'px,' + (Math.sin(ang)*dist).toFixed(1) + 'px)';
      d.dataset.d = (0.05 + Math.random() * 0.7).toFixed(3);
      ring.appendChild(d);
      const g = document.createElementNS(NS, 'text');
      g.setAttribute('class', 'trch');
      g.setAttribute('x', x.toFixed(1)); g.setAttribute('y', y.toFixed(1));
      // 基线先贴路径点，再在旋转后的局部坐标系里向圆心平移（法线方向，全环同心）
      g.setAttribute('transform', 'rotate(' + rot.toFixed(1) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ') translate(0 ' + DY + ')');
      g.style.transition = 'opacity .28s ease';
      g.style.opacity = '0';
      g.dataset.d = d.dataset.d;
      g.textContent = ch;
      ring.appendChild(g);
    });
  });
}

function l2Play(){
  l2Clear();
  const rings = document.querySelectorAll('.ring16');
  const amb = document.getElementById('loopAmbient');
  const f2 = document.getElementById('loopFinale2');
  if (!rings.length) return;
  l2BuildRings();
  const svgEl = document.getElementById('loopSvg');
  if (svgEl && svgEl.pauseAnimations) svgEl.pauseAnimations();   // 拼字阶段环不转
  amb.style.opacity = '.55';
  f2.classList.remove('on');
  void document.getElementById('loopSvg').getBoundingClientRect();

  // 粒子按各自时刻起飞（setTimeout 调度，不依赖 transition-delay）
  rings.forEach(r => r.querySelectorAll('.pdot').forEach(d => {
    l2At(() => { d.style.transform = 'translate(0px,0px)'; }, 90 + parseFloat(d.dataset.d) * 1000);
  }));
  // 到位即交接：字符显形、粒子让位（成对同时刻）
  rings.forEach(r => r.querySelectorAll('.trch').forEach((g, i) => {
    const d = parseFloat(g.dataset.d);
    l2At(() => { g.style.opacity = '1'; }, 90 + (d + 0.72) * 1000);
    const pd = r.querySelectorAll('.pdot')[i];
    l2At(() => { pd.style.opacity = '0'; }, 90 + (d + 0.78) * 1000);
  }));
  // 全部落定：双子/星尘淡入、底光提亮、三环开转
  l2At(() => {
    f2.classList.add('on');
    amb.style.opacity = '1';
    if (svgEl && svgEl.unpauseAnimations) svgEl.unpauseAnimations();  // 落定开转
  }, 2500);
  // steady 结束：逐字溃散（字符熄灭 → 粒子复现并飞离）
  l2At(() => {
    f2.classList.remove('on');
    amb.style.opacity = '.55';
    if (svgEl && svgEl.pauseAnimations) svgEl.pauseAnimations();
    rings.forEach(r => {
      r.querySelectorAll('.trch').forEach(g => {
        l2At(() => { g.style.opacity = '0'; }, Math.random() * 450);
      });
      r.querySelectorAll('.pdot').forEach(d => {
        l2At(() => { d.style.opacity = '1'; d.style.transform = d.dataset.home; }, Math.random() * 500);
        l2At(() => { d.style.opacity = '0'; }, 700 + Math.random() * 500);
      });
    });
  }, 34500);
  l2At(l2Play, 37200);
}


if (!matchMedia('(prefers-reduced-motion: reduce)').matches) l2Play();
else {
  document.querySelectorAll('.ring16').forEach(r => { r.classList.add('landed'); });
  const f = document.getElementById('loopFinale2');
  if (f) f.classList.add('on');
  const a = document.getElementById('loopAmbient');
  if (a) a.style.opacity = '1';
  const sv = document.getElementById('loopSvg');
  if (sv && sv.pauseAnimations) sv.pauseAnimations();
}
let l2PausedByHidden = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { l2PausedByHidden = true; l2Clear(); }
  else if (l2PausedByHidden && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    l2PausedByHidden = false;
    setTimeout(l2Play, 300);   // 防抖：可见且稳定后再重启，避免合成可见性抖动反复重置循环
  }
});
</script>
