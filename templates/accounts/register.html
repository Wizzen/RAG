{% extends "accounts/_auth_base.html" %}
{% block title %}注册 · SHDR RAG{% endblock %}
{% block auth_card %}
<div class="ah">注册</div>
<div class="ab">
  {% if form.errors %}<div class="auth-error">注册信息有误</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field"><label>用户名</label><input name="username" autofocus required></div>
    <div class="field"><label>密码</label><input name="password1" type="password" required></div>
    <div class="field"><label>确认密码</label><input name="password2" type="password" required></div>
    <button class="btn primary" type="submit">注册</button>
  </form>
  <div class="auth-foot">已有账号？<a href="/accounts/login/">登录</a></div>
</div>
{% endblock %}
